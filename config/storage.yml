test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

s3:
  service: S3
  access_key_id: <%= ENV["S3_KEY"] %>
  secret_access_key: <%= ENV["S3_SECRET"] %>
  bucket: <%= ENV["S3_BUCKET"] %>
  <%= "region: #{ENV["S3_REGION"]}" if ENV["S3_REGION"].present? %>
  <%= "endpoint: #{ENV["S3_ENDPOINT"]}" if ENV["S3_ENDPOINT"].present? %>

